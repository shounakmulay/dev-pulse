name: Code quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: ./.github/actions/setup-play-auth

      - name: Check Kotlin code quality
        run: .github/scripts/quality.sh

      - name: Test database, feed and network behavior
        run: .github/scripts/jvm-tests.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: quality-reports
          path: |
            build/reports/
            **/build/reports/
            **/build/test-results/
          retention-days: 7
