config:
  validation: true
  warningsAsErrors: true
exceptions:
  active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  InstanceOfCheckForException:
    active: true
potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
complexity:
  active: true
  NestedBlockDepth:
    active: true
    threshold: 5
    ignoreAnnotated: ['Composable']
Compose:
  active: true
  MutableStateParam:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  ModifierNotUsedAtRoot:
    active: true
